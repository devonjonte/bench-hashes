const SECTIONS = [{"title":"How fast each hash runs, by what a program hashes and how it calls","rows":[["one","one message","One logical message."],["batch","a batch of short messages","Many 64-byte messages hashed together, such as a Merkle tree's nodes; the axis counts the messages."],["long","a batch of longer messages","Many 4 KiB messages hashed together, such as a store's blocks or a backup's chunks; the axis counts the messages."],["merkle","a Merkle tree","A Merkle tree over 256-byte leaves the program has just written into place, leaves and parents hashed apart, every layer kept, as a zero-knowledge prover commits to its Reed-Solomon codeword (WHIR); the axis counts the leaves."],["many","many messages at once, in pieces","256 messages in progress at once, their pieces arriving 64 at a time, as a server's uploads arrive."],["coll","a collection of messages","A collection of messages of every size, such as a repository's objects or a store's files, hashed together."]],"cols":[["receiving","receive + hash, including waits","A message arrives in fragments on a fixed schedule, independent of the hash calls. A saturated source supplies the next fragment immediately. The time includes receiving, waiting, hashing and finalization; its rate is end-to-end reception, not hashing alone."],["busy","now and then, after other work","The program hashes now and then and does other work in between, which pushes the hash's code and data out of the CPU's caches."],["brief","now and then, after a brief pause","The program hashes now and then and waits 20 μs in between (a reply arrives at once), so the core keeps its clock and its shallowest rest."],["idle","now and then, after a pause","The program hashes now and then and waits 5 ms in between (for the network, say), so the core rests deeply and starts the next hash slowly."],["controlled","now and then, after a pause, deep rest off","The same 5 ms pause with the core's deep idle states switched off (the bench ran as root), s   z.querySelector(".close").onclick = e => { e.stopPropagation(); close(); };
  /* Escape puts it back too. */
  const onKey = e => { if (e.key === "Escape") { document.removeEventListener("keydown", onKey); close(); } };
  document.addEventListener("keydown", onKey); window.onZoomKey = onKey;
  z.onclick = e => { if (touch) show(e); else close(); };
  /* A click anywhere else on the page puts it back too, except on the
     chips, which redraw it in place. */
  const outside = e => { if (!z.isConnected) return document.removeEventListener("click", outside); if (!z.contains(e.target) && !e.target.closest(".measures, .legend")) close(); };
  setTimeout(() => document.addEventListener("click", outside));
}
render();
/* A chip clicked inside an open chart: redraw, and open it again at full size at once. */
function reopen() {
  const key = OPEN; if (!key) return;
  const cell = document.querySelector(`.cell[data-key="${CSS.escape(key)}"]`);
  if (cell) { cell.dataset.instant = "1"; cell.click(); delete cell.dataset.instant; } else OPEN = null;
}
/* A link to one chart (#solo|one|lent, or #1:solo|file|cached for a later section) opens it. */
function openFromHash() {
  if (location.hash.length < 2) return;
  // #run opens the run's record (the overview links each machine's line to it).
  if (location.hash === "#run") {
    RUN_OPEN = true; render();
    document.querySelector("details.run").scrollIntoView({ block: "start" });
    return;
  }
  const want = decodeURIComponent(location.hash.slice(1)), key = want.includes(":") ? want : "0:" + want;
  const cell = document.querySelector(`.cell[data-key="${CSS.escape(key)}"]`);
  if (!cell || document.querySelector(".zoom")) return;
  cell.scrollIntoView({ block: "center" });
  cell.click();
  // The chart grows from the small cell into a larger box (.zoom's 0.2 s
  // transition), which can reach below the screen: once grown, bring the
  // opened chart itself into view, centred if it fits, else from its top
  // (a link from the overview opened it below the fold, Zooko, October 24).
  const zoom = document.querySelector(".zoom");
  if (!zoom) return;
  let done = false;
  const show = () => {
    if (done) return;
    done = true;
    zoom.scrollIntoView({ block: zoom.offsetHeight <= innerHeight ? "center" : "start" });
  };
  // When its growth ends (the last of its transitions), or soon after in
  // any case.
  zoom.addEventListener("transitionend", () => setTimeout(show, 30));
  setTimeout(show, 600);
}
// After the page has laid out, so nothing moves the chart afterwards.
if (document.readyState === "complete") openFromHash(); else addEventListener("load", openFromHash);
window.addEventListener("hashchange", openFromHash);
</script></body></html>
