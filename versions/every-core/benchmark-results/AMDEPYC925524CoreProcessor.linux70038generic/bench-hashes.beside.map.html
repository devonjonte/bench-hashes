<p class="sub">Each small chart is one measurement: its row is what a program hashes, its column how it calls; point at either name for what it means. Open a chart to read its values; its names hide or show their lines.</p>

const SECTIONS = [{"title":"How fast each hash runs, by what a program hashes and how it calls","rows":[["one","one message","One logical message."],["batch","a batch of short messages","Many 64-byte messages hashed together, such as a Merkle tree's nodes; the axis counts the messages."],["long","a batch of longer messages","Many 4 KiB messages hashed together, such as a store's blocks or a backup's chunks; the axis counts the messages."],["merkle","a Merkle tree","A Merkle tree over 256-byte leaves the program has just written into place, leaves and parents hashed apart, every layer kept, as a zero-knowledge prover commits to its Reed-Solomon codeword (WHIR); the axis counts the leaves."],["many","many messages at once, in pieces","256 messages in progress at once, their pieces arriving 64 at a time, as a server's uploads arrive."],["coll","a collection of messages","A collection of messages of every size, such as a repository's objects or a store's files, hashed together."]],"cols":[["receiving","receive + hash, including waits","A message arrives in fragments on a fixed schedule, independent of the hash calls. A saturated source supplies the next fragment immediately. The time includes receiving, waiting, hashing and finalization; its rate is end-to-end reception, not hashing alone."],["busy","now and then, after other work","The program hashes now and then and does other work in between, which pushes the hash's code and data out of the CPU's caches."],["brief","now and then, after a brief pause","The program hashes now and then and waits 20 μs in between (a reply arrives at once), so the core keeps its clock and its shallowest rest."],["idle","now and then, after a pause","The program hashes now and then and waits 5 ms in between (for the network, say), so the core rests deeply and starts the next hash slowly."],["controlled","now and then, after a pause, deep rest off","The same 5 ms pause with the core's deep idle states switched off (the bench ran as root), s
