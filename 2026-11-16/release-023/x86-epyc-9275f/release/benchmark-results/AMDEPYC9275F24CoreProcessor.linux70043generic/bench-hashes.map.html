<p class="sub">Each small chart is one measurement: its row is what a program hashes, its column how it calls; point at either name for what it means. Open a chart to read its values; its names hide or show their lines.</p>

const SECTIONS = [{"title":"How fast each hash runs, by what a program hashes and how it calls","rows":[["one","one message","One logical message."],["incremental","one short message, fresh hasher","Create an incremental hasher, update once with the complete message, finalize and consume its digest. A fresh hasher for every message."],["batch","a batch of short messages","Many 64-byte messages hashed together, such as a Merkle tree's nodes; the axis counts the messages."],["long","a batch of longer messages","Many 4 KiB messages hashed together, such as a store's blocks or a backup's chunks; the axis counts the messages."],["merkle","a Merkle tree","A Merkle tree over 256-byte leaves the program has just written into place, leaves and parents hashed apart, every layer kept, as a zero-knowledge prover commits to its Reed-Solomon codeword (WHIR); the axis counts the leaves."],["many","many messages at once, in pieces","256 messages in progress at once, their pieces arriving 64 at a time, as a server's uploads arrive."],["coll","a collection of messages","A collection of messages of every size, such as a repository's objects or a store's files, hashed together."]],"cols":[["receiving","receive + hash, including waits","A message arrives in fragments on a fixed schedule, independent of the hash calls. A saturated source supplies the next fragment immediately. The time includes receiving, waiting, hashing and finalization; its rate is end-to-end reception, not hashing alone."],["busy","now and then, after other work","The program hashes now and then and does other work in between, which pushes the hash's code and data out of the CPU's caches."],["brief","now and then, after a brief pause","The program hashes now and then and waits 20 μs in between (a reply arrives at once), so the core keeps its clock and its shallowest rest."],["idle","now and then, after a pause","The program hashes now and then and waits 5 ms in between (for the network, say), so the core rests deeply and starts the next hash slowly."],["controlled","now and then, after a pause, deep rest off","The same 5 ms pause with the core's deep idle states switched off (the bench ran as root), so the call meets the core awake: the library's own cost, apart from the machine's rest."],["lent","nonstop, waiting for each call","The program hashes input after input as fast as it can, reading each input once the hash before it has returned."],["piped","nonstop, pipelined","The program hashes input after input as fast as it can, and reads the next inputs while earlier ones hash: it hands its inputs to BLAKE3-Servil's stream, which hashes them on other threads. The other hashes have no such call and hash on the program's thread."]],"layers":[["solo","one program","One program hashes; the machine is otherwise quiet."],["shared-one-cache","two programs at once, one cache","Two programs hash at the same moment, nonstop, on two cores under one last-level cache: they share the cache and the memory path, as two programs on a busy machine most often do."],["shared-two-caches","two programs at once, two caches","Two programs hash at the same moment, nonstop, on two cores under different last-level caches: they share the memory path and little else."],["shared-os","two programs at once, placed by the OS","Two programs hash at the same moment, nonstop, wherever the operating system runs them: this machine lets no program choose its CPUs, so the two may share a cluster's cache or not, sample by sample."]],"names":["BLAKE3 official","SHA-256","SHA-1DC","BLAKE3-Servil st","SHA-256 ring","BLAKE3 official mt","BLAKE3-Servil mt","SHA3-256"],"colors":["#3b82f6","#e07a45","#8a7a1e","#7c3aed","#c2410c","#3b82f6","#7c3aed","#db2777"],"striped":[false,false,false,false,false,true,true,false],"ours":[false,false,false,true,false,false,true,false],"shown":[true,false,false,false,true,false,true,false],"cells":{"solo|one|busy":{"sizes":["64 B","128 B","256 B","512 B","1 KiB","1536 B","2 KiB","2304 B","3   const lit = [...grid.querySelectorAll(".h")].filter(h => h.dataset.key === "row:" + row || h.dataset.key === "col:" + col);
  lit.forEach(h => h.classList.add("lit"));
  const tip = document.getElementById("tip"), cur = z.querySelector(".cursor");
  tip.style.display = "none";
  /* A touch's tap shows the values at its point (the finger moves no
     pointer); a mouse's click, or the button, puts the chart back. */
  let touch = false;
  plot.onpointerdown = e => { touch = e.pointerType !== "mouse"; };
  const show = e => {
    const zr = plot.getBoundingClientRect(), mx = e.clientX - zr.left;
    const slot = (d.w - d.L - d.R) / (q.cases ? d.n : Math.max(d.n - 1, 1));
    const k = d.n === 1 ? 0 : Math.max(0, Math.min(d.n - 1, Math.round((mx - d.L) / slot - (q.cases ? 0.5 : 0))));
    cur.setAttribute("x1", d.x(k)); cur.setAttribute("x2", d.x(k)); cur.setAttribute("visibility", "visible");
    tip.innerHTML = tipHTML(S, q, k);
    tip.style.display = "block";
    /* Measured at the left edge, at its full width, then placed. */
    tip.style.left = "0px";
    tip.style.left = Math.max(4, Math.min(e.clientX + 14, screenWidth() - tip.offsetWidth - 4)) + "px";
    /* Above a finger, which would hide it; below a mouse pointer. */
    tip.style.top = Math.max(4, Math.min(touch ? e.clientY - tip.offsetHeight - 24 : e.clientY + 10, screenHeight() - tip.offsetHeight - 4)) + "px";
  };
  plot.onmousemove = e => { if (!touch) show(e); };
  /* A mouse leaving hides the values; after a touch, the emulated mouse events that follow a tap would hide what the tap showed, so they wait for the next tap. */
  plot.onmouseleave = () => { if (touch) return; tip.style.display = "none"; cur.setAttribute("visibility", "hidden"); };
  const close = () => { OPEN = null; document.removeEventListener("click", outside); document.removeEventListener("keydown", onKey); tip.style.display = "none"; lit.forEach(h => h.classList.remove("lit")); z.remove(); };
  z.querySelector(".close").onclick = close;
  /* Escape puts it back too. */
  const onKey = e => { if (e.key === "Escape") { document.removeEventListener("keydown", onKey); close(); } };
  document.addEventListener("keydown", onKey); window.onZoomKey = onKey;
  plot.onclick = e => { if (touch) show(e); else close(); };
  /* A click anywhere else on the page puts it back too, except on the
     chips, which redraw it in place. */
  const outside = e => { if (!z.isConnected) return document.removeEventListener("click", outside); if (!z.contains(e.target) && !e.target.closest(".measures, .legend")) close(); };
  setTimeout(() => document.addEventListener("click", outside));
}
render();
/* A chip clicked inside an open chart: redraw, and open it again at full size at once. */
function reopen() {
  const key = OPEN; if (!key) return;
  const cell = document.querySelector(`.cell[data-key="${CSS.escape(key)}"]`);
  if (cell) cell.click(); else OPEN = null;
}
/* A link to one chart (#solo|one|lent, or #1:solo|file|cached for a later section) opens it. */
function openFromHash() {
  if (location.hash.length < 2) return;
  // #run opens the run's record (the overview links each machine's line to it).
  if (location.hash === "#run") {
    RUN_OPEN = true; render();
    document.querySelector("details.run").scrollIntoView({ block: "start" });
    return;
  }
  const want = decodeURIComponent(location.hash.slice(1)), key = want.includes(":") ? want : "0:" + want;
  const cell = document.querySelector(`.cell[data-key="${CSS.escape(key)}"]`);
  if (!cell || document.querySelector(".zoom")) return;
  cell.scrollIntoView({ block: "center" });
  cell.click();
}
// After the page has laid out, so nothing moves the chart afterwards.
if (document.readyState === "complete") openFromHash(); else addEventListener("load", openFromHash);
window.addEventListener("hashchange", openFromHash);
