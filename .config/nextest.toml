# cargo-nextest's settings for this repository.

# clocks' tests that judge other programs' load run with the machine to
# themselves: every other test running beside them is other load, and moved
# the background a test measures first (a_sibling_beside_the_child_reads_as_load
# failed beside the bench's tests, and passed alone). Inside one process
# they take turns (clocks::load::exclusive); nextest runs each in its own.
# (In BLAKE3-Servil, clocks ran all its tests one at a time, October 26; a
# workspace member's own nextest config is never read.)
[[profile.default.overrides]]
filter = 'package(clocks) & test(/^(child|load)::tests::/)'
threads-required = "num-cpus"

# The machine's properties (clocks' `machine` test modules: timing, the
# OS's counters, children) run on purpose, `cargo nextest run -P machine`,
# before a release and on a new machine; every other profile leaves them
# out, so a change's tests and a mutant's run in under a second and other
# load cannot fail them. In that profile they run one at a time.
[profile.default]
default-filter = 'not test(/::machine::/)'

[profile.machine]
default-filter = 'test(/::machine::/)'

[[profile.machine.overrides]]
filter = 'test(/::machine::/)'
threads-required = "num-cpus"
