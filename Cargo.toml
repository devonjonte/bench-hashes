[package]
name = "bench-hashes"
version = "0.17.0+1b480eed20d11d7cd1417384e4a9d540b0e321be"
edition = "2021"
rust-version = "1.88"
build = "build.rs"

[dependencies]
# The `rayon` feature adds Hasher::update_rayon for the BLAKE3 mt contender;
# blake3::hash and every other API stay single-threaded with it on.
[dependencies.blake3]
version = "1"
default-features = false
features = ["std", "rayon"]

# iroh-blobs' outboards (pre-order, 16 KiB blocks), on crates.io BLAKE3:
# the BLAKE3 contender's call for a message's outboard.
[dependencies.bao-tree]
version = "=0.16.1"
default-features = false

# With `--features smalloc`, smalloc (crates.io's smmalloc) is the global
# allocator: an allocator programs may run under, and one whose slots sit at
# page offsets that follow only their own size class's allocations.
[dependencies.smalloc]
package = "smmalloc"
version = "7.6"
optional = true

# Seeded hashing for every map (crate::Map): runs lay out alike.
[dependencies.wyhash]
version = "0.6"

# Machine metadata does not need sysinfo's multithread feature.
[dependencies.sysinfo]
version = "0.30"
default-features = false

# sha2 0.11 carries its own hardware backends (ARMv8 SHA-256 instructions,
# x86 SHA-NI) with runtime detection, on every target.
[dependencies.sha2]
version = "0.11"
default-features = false

# SHA3-256: keccak 0.2 detects the ARMv8 SHA-3 instructions at run time.
[dependencies.sha3]
version = "0.11"
default-features = false

# SHA-256 through BoringSSL's assembly (OpenSSL lineage), which pipelines
# the next block's message schedule under the current block's rounds.
[dependencies.ring]
version = "0.17"
default-features = false

# BLAKE3 servil, and the one place clocks are read (the fork's clocks/
# crate: wall time, and the thread's counts per core kind). Each pin names
# its full commit hash: the contender's code, and the instrument's clocks.
# build-against replaces the contender and keeps the instrument pinned.
# To build against a local checkout of the fork instead, with this
# repository inside it, add
#   --config 'patch."https://github.com/johnservil/BLAKE3".blake3-servil.path=".."'
# to the cargo command (CONTRIBUTING.md).
[dependencies.blake3-servil]
git = "https://github.com/johnservil/BLAKE3"
rev = "b94e2fac72b8be346e8c012c6a749caa134e2480"
default-features = false
features = ["std"]

[dependencies.clocks]
git = "https://github.com/johnservil/BLAKE3"
rev = "b94e2fac72b8be346e8c012c6a749caa134e2480"

# SHA-1 with collision detection (the SHA-1DC construction git uses), pure
# Rust; there is no hardware path for the detection.
[dependencies.sha1-checked]
version = "0.10"

[build-dependencies]
# Used to fingerprint a dirty benchmark working tree.
[build-dependencies.blake3]
version = "1"
default-features = false
features = ["std"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false

[features]
smalloc = ["dep:smalloc"]
# Diagnostic only: the system allocator with every allocation of 64 bytes
# or more aligned to 64 (a cache line), to test whether placement within a
# line decides #65's states. Never a measurement configuration.
diag-align64 = []
# Diagnostic only: the system allocator with every allocation of 64 bytes or
# more (alignment 16 or less) placed BENCH_DIAG_LINE_OFFSET bytes (build
# time) into a cache line. The converse of diag-align64.
diag-line-offset = []
