/* A library's multi-threaded form wears its single-threaded form's colour
   as a double line: the colour, a white core along it (Zooko, October 24).
   `rest` is the line's other attributes (dashes, caps, opacity). */
function line(S, i, points, width, rest = "") {
  const one = (stroke, w) => `<polyline points="${points}" fill="none" stroke="${stroke}" stroke-width="${w}" ${rest}/>`;
  return S.striped && S.striped[i] ? one(S.colors[i], width + 1.6) + one("#fff", Math.max(0.8, width * 0.55)) : one(S.colors[i], width);
}
/* A dot: filled for a single-threaded form, a ring for a multi-threaded one. */
function dot(S, i, cx, cy, r) {
  return S.striped && S.striped[i] ? `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="${S.colors[i]}" stroke-width="1.8"/>` : `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${S.colors[i]}"/>`;
}
/* A swatch's background: the colour, or its stripes. */
function swatch(S, i) {
  const c = S.colors[i];
  return S.striped && S.striped[i] ? `repeating-linear-gradient(135deg, ${c} 0 2px, #fff 2px 3.5px)` : c;
}

  const was = i => { const v = S.besideNow && q.before[i] && q.before[i][k]; return v ? ` <span class="was">(before: ${(1 / v).toPrecision(3)}; now ×${(v / q.series[i][k]).toFixed(2)})</span>` : ""; };
  const time = ns => ns >= 1e6 ? (ns / 1e6).toPrecision(3) + " ms" : ns >= 1e3 ? (ns / 1e3).toPrecision(3) + " µs" : ns.toPrecision(3) + " ns";
  const cpuOf = i => { const v = q.cpu[i] && q.cpu[i][k]; return v ? `${M.wall ? "; " : ""}CPU ${SHOW.cost ? v.toPrecision(3) + " ns/B · " : ""}${time(v * q.per[k])} ${q.what}` : M.wall ? "" : "no CPU time recorded"; };
  const energyOf = i => { const v = q.energy[i] && q.energy[i][k]; if (!v) return ""; const nj = v * q.per[k]; return `${M.wall || M.cpu ? "; " : ""}energy ${SHOW.cost ? v.toPrecision(3) + " nJ/B · " : (1 / v).toPrecision(3) + " GB/J · "}${nj >= 1e6 ? (nj / 1e6).toPrecision(3) + " mJ" : nj >= 1e3 ? (nj / 1e3).toPrecision(3) + " µJ" : nj.toPrecision(3) + " nJ"} ${q.what}`; };
  /* Where the caller ran: its E-core share and the clocks, where counted. */
  const ran = i => { const c = q.cores && q.cores[i] && q.cores[i][k]; if (!c) return ""; const [e, p, ee] = c; return ` <span class="was">[${e < 0.005 ? `P cores, ${p.toFixed(2)} GHz` : e > 0.995 ? `E cores, ${ee.toFixed(2)} GHz` : `${(100 * e).toFixed(0)}% on E cores; P ${p.toFixed(2)}, E ${ee.toFixed(2)} GHz`}]</span>`; };
  /* A contender a block: what wraps indents under its name. */
  return `${q.axis}: <b>${q.sizes[k]}</b>` + rows.map(([i, rate, t]) => `<div class="row"><span class="sw" style="background:${swatch(S, i)}"></span>${S.names[i]}: ` + (M.wall ? `${SHOW.cost ? t.toPrecision(3) + " ns/B" : rate.toPrecision(3) + " " + q.unit} · ${time(t * q.per[k])} ${q.what}${was(i)}${ran(i)}` : "") + (M.cpu ? cpuOf(i) : "") + (M.energy ? energyOf(i) : "") + "</div>").join("");
}
/* A collapsed card's hover: the opened chart's values at the pointer's
   point, the cursor on that point; a click still opens the chart. */
function hoverTip(cell, S, q, d) {
  const cur = cell.querySelector(".cursor"), tip = document.getElementById("tip"), svg = cell.querySelector("svg");
  if (!cur) return;
  cell.onmousemove = e => {
    const r = svg.getBoundingClientRect(), mx = (e.clientX - r.left) / r.width * d.w;
    const slot = (d.w - d.L - d.R) / (q.cases ? d.n : Math.max(d.n - 1, 1));
    const k = d.n === 1 ? 0 : Math.max(0, Math.min(d.n - 1, Math.round((mx - d.L) / slot - (q.cases ? 0.5 : 0))));
    cur.setAttribute("x1", d.x(k)); cur.setAttribute("x2", d.x(k)); cur.setAttribute("visibility", "visible");
    tip.innerHTML = tipHTML(S, q, k);
    tip.style.display = "block";
    tip.style.left = "0px";
    tip.style.left = Math.max(4, Math.min(e.clientX + 14, screenWidth() - tip.offsetWidth - 4)) + "px";
    tip.style.top = Math.max(4, Math.min(e.clientY + 10, innerHeight - tip.offsetHeight - 4)) + "px";
  };
  cell.onmouseleave = () => { cur.setAttribute("visibility", "hidden"); tip.style.display = "none"; };
}
/* Opening: the chart grows from its own cell over the cells' area, the headers in view, and shrinks back into it. */
function open(S, grid, cell, q, row, col, layer) {
  const gr = grid.getBoundingClientRect(), cr = cell.getBoundingClientRect();
  const first = grid.querySelector(".cell").getBoundingClientRect();
  const phone = narrow();
  /* A phone: a panel across the screen under the bar, at full size (the
     grid is scaled down); else over the grid's cells, the headers in view. */
  const bar = document.querySelector(".measures").getBoundingClientRect().bottom;
  const X0 = phone ? 6 : first.left - gr.left, Y0 = phone ? bar + 4 : first.top - gr.top;
  const W = phone ? screenWidth() - 12 : Math.max(Math.min(gr.width - X0, window.innerWidth - first.left - 6), 640);
  const H = phone ? Math.max(360, window.innerHeight - Y0 - 6) : Math.max(gr.height - Y0, 340);
  const z = document.createElement("div"); z.className = "zoom" + (phone ? " phone" : "");
  const start = phone ? { left: cr.left, top: cr.top, width: cr.width, height: cr.height } : { left: cr.left - gr.left, top: cr.top - gr.top, width: cr.width, height: cr.height };
  const place = r => Object.assign(z.style, Object.fromEntries(Object.entries(r).map(([k, v]) => [k, v + "px"])));
  const instant = cell.dataset.instant === "1";
  OPEN = cell.dataset.key;
  if (instant) z.style.transition = "none";
  place(start); (phone ? document.body : grid).appendChild(z);
  const d = draw(S, q, W, H, true);
  const rn = S.rows.find(r => r[0] === row)[1], cn = S.cols.find(c => c[0] === col)[1];
  const ln = S.layers.length > 1 ? ", " + S.layers.find(l => l[0] === layer)[1] : "";
  z.innerHTML = d.svg + `<div class="title">${glyph(row, 16)}${glyph(col, 16)} ${rn}, ${cn}${ln}: <code><a class="doc" href="${q.doc}" target="_blank" title="its documentation">${q.call}</a></code></div><button class="close">✕<span class="word"> put back</span></button>`;
  z.querySelector("a.doc").onclick = e => e.stopPropagation();
  /* The chart's contenders under its title, each name its toggle. */
  const key = document.createElement("div"); key.className = "key";
  key.style.left = d.L + "px"; key.style.top = (phone && narrow() ? 72 : 40) - 10 + "px";
  q.series.forEach((v, i) => {
    if (!v) return;
    const b = document.createElement("button"); b.style.setProperty("--c", S.colors[i]);
    b.textContent = S.names[i];
    if (!S.shownNow[i]) b.classList.add("off");
    b.title = S.shownNow[i] ? "hide its lines" : "show its lines";
    b.onclick = e => { e.stopPropagation(); S.shownNow[i] = !S.shownNow[i]; render(); reopen(); };
    key.appendChild(b);
  });
  z.appendChild(key);
  if (instant) { place({ left: X0, top: Y0, width: W, height: H }); requestAnimationFrame(() => { z.style.transition = ""; }); }
  else requestAnimationFrame(() => place({ left: X0, top: Y0, width: W, height: H }));
  const lit = [...grid.querySelectorAll(".h")].filter(h => h.dataset.key === "row:" + row || h.dataset.key === "col:" + col);
  lit.forEach(h => h.classList.add("lit"));
  const tip = document.getElementById("tip"), cur = z.querySelector(".cursor");
  /* A touch's tap shows the values at its point (the finger moves no
     pointer); a mouse's click, or the button, puts the chart back. */
  let touch = false;
  z.onpointerdown = e => { touch = e.pointerType !== "mouse"; };
  const show = e => {
    const zr = z.getBoundingClientRect(), mx = e.clientX - zr.left;
    const slot = (d.w - d.L - d.R) / (q.cases ? d.n : Math.max(d.n - 1, 1));
    const k = d.n === 1 ? 0 : Math.max(0, Math.min(d.n - 1, Math.round((mx - d.L) / slot - (q.cases ? 0.5 : 0))));
    cur.setAttribute("x1", d.x(k)); cur.setAttribute("x2", d.x(k)); cur.setAttribute("visibility", "visible");
    tip.innerHTML = tipHTML(S, q, k);
    tip.style.display = "block";
    /* Measured at the left edge, at its full width, then placed. */
    tip.style.left = "0px";
    tip.style.left = Math.max(4, Math.min(e.clientX + 14, screenWidth() - tip.offsetWidth - 4)) + "px";
    /* Above a finger, which would hide it; below a mouse pointer. */
    tip.style.top = Math.max(4, Math.min(touch ? e.clientY - tip.offsetHeight - 24 : e.clientY + 10, innerHeight - tip.offsetHeight - 4)) + "px";
  };
  z.onmousemove = e => { if (!touch) show(e); };
  /* A mouse leaving hides the values; after a touch, the emulated mouse events that follow a tap would hide what the tap showed, so they wait for the next tap. */
  z.onmouseleave = () => { if (touch) return; tip.style.display = "none"; cur.setAttribute("visibility", "hidden"); };
  const close = () => { OPEN = null; document.removeEventListener("click", outside); document.removeEventListener("keydown", onKey); tip.style.display = "none"; lit.forEach(h => h.classList.remove("lit")); place(start); setTimeout(() => z.remove(), 220); };
  z.querySelector(".close").onclick = e => { e.stopPropagation(); close(); };
  /* Escape puts it back too. */
  const onKey = e => { if (e.key === "Escape") { document.removeEventListener("keydown", onKey); close(); } };
  document.addEventListener("keydown", onKey); window.onZoomKey = onKey;
  z.onclick = e => { if (touch) show(e); else close(); };
  /* A click anywhere else on the page puts it back too, except on the
     chips, which redraw it in place. */
  const outside = e => { if (!z.isConnected) return document.removeEventListener("click", outside); if (!z.contains(e.target) && !e.target.closest(".measures, .legend")) close(); };
  setTimeout(() => document.addEventListener("click", outside));
}
render();
/* A chip clicked inside an open chart: redraw, and open it again at full size at once. */
function reopen() {
  const key = OPEN; if (!key) return;
  const cell = document.querySelector(`.cell[data-key="${CSS.escape(key)}"]`);
  if (cell) { cell.dataset.instant = "1"; cell.click(); delete cell.dataset.instant; } else OPEN = null;
}
/* A link to one chart (#solo|one|lent, or #1:solo|file|cached for a later section) opens it. */
function openFromHash() {
  if (location.hash.length < 2) return;
  const want = decodeURIComponent(location.hash.slice(1)), key = want.includes(":") ? want : "0:" + want;
  const cell = document.querySelector(`.cell[data-key="${CSS.escape(key)}"]`);
  if (!cell || document.querySelector(".zoom")) return;
  cell.scrollIntoView({ block: "center" });
  cell.click();
  // The chart grows from the small cell into a larger box (.zoom's 0.2 s
  // transition), which can reach below the screen: once grown, bring the
  // opened chart itself into view, centred if it fits, else from its top
  // (a link from the overview opened it below the fold, Zooko, October 24).
  const zoom = document.querySelector(".zoom");
  if (!zoom) return;
  let done = false;
  const show = () => {
    if (done) return;
    done = true;
    zoom.scrollIntoView({ block: zoom.offsetHeight <= innerHeight ? "center" : "start" });
  };
  // When its growth ends (the last of its transitions), or soon after in
  // any case.
  zoom.addEventListener("transitionend", () => setTimeout(show, 30));
  setTimeout(show, 600);
}
// After the page has laid out, so nothing moves the chart afterwards.
if (document.readyState === "complete") openFromHash(); else addEventListener("load", openFromHash);
window.addEventListener("hashchange", openFromHash);
</script></body></html>
