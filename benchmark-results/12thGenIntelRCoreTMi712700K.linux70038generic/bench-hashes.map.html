/* One rate axis for the whole page: every chart of every section, every
   contender and measure, so a line's height reads the same everywhere,
   whatever is set aside, and one chart's level compares with another's. */
let AXIS = null;
function axisOf() {
  if (!AXIS) {
    /* Over the measures shown: a hidden one (energy's joules) would stretch the scale. */
    const lines = c => [].concat(MEASURES.wall ? c.series.concat(c.before) : [], MEASURES.cpu ? c.cpu : [], MEASURES.energy ? c.energy : []);
    const vals = SECTIONS.flatMap(S => Object.values(S.cells).flatMap(c => lines(c).filter(Boolean).flat())).filter(v => v).map(shown);
    AXIS = [Math.log(Math.min(...vals)) - 0.1, Math.log(Math.max(...vals)) + 0.1];
  }
  return AXIS;
}
/* A row's shared axis: the page's one scale at the cards' height, its
   powers of ten named once for the row (each card's faint lines meet them). */
function rowAxis() {
  const [lo, hi] = axisOf(), h = 94, T = 8, B = 14;
  const y = v => h - B - (Math.log(v) - lo) / (hi - lo) * (h - T - B);
  let s = `<svg width="38" height="${h}">`;
  for (let e = Math.ceil(lo / Math.LN10); e <= Math.floor(hi / Math.LN10); e++) {
    s += `<line x1="32" x2="38" y1="${y(10 ** e)}" y2="${y(10 ** e)}" stroke="#d6d2cb"/>`;
    s += `<text x="30" y="${y(10 ** e) + 3}" font-size="9.5" fill="#4b5563" text-anchor="end">${+(10 ** e).toPrecision(1)}</text>`;
  }
  return s + "</svg>";
}
/* One chart's lines, rates (bytes over each mean time) on the section's log scale; the opened one with axes. */
function draw(S, c, w, h, axes) {
  const live = c.series.map((s, i) => s && S.shownNow[i] ? i : -1).filter(i => i >= 0);
  const [lo, hi] = axisOf();
  /* An opened chart names its contenders above the plot, the names its
     toggles (open() places them), a phone's title taking two lines and two
     names to a row; case labels may take two lines below it. */
  const listed = axes ? c.series.filter(Boolean).length : 0;
  const tall = axes && narrow(), top = tall ? 72 : 40;
  const n = c.sizes.length, L = axes ? (tall ? 50 : 70) : 8, R = axes ? 52 : 34, T = axes ? top + 22 * Math.ceil(listed / (tall ? 2 : 5)) + 8 : 8, B = axes ? (c.cases ? 84 : 62) : 14;
  /* Sizes run edge to edge; separate cases sit in the middles of equal slots. */
  const x = k => n === 1 || c.cases ? L + (k + 0.5) * (w - L - R) / n : L + k * (w - L - R) / (n - 1);
  const y = v => h - B - (Math.log(v) - lo) / (hi - lo) * (h - T - B);
  let s = `<svg width="${w}" height="${h}">`;
  /* Every chart shares the page's log scale: faint lines at each power of
     ten, labelled small, show it in equal steps per factor of ten. */
  if (!axes) for (let e = Math.ceil(lo / Math.LN10); e <= Math.floor(hi / Math.LN10); e++) {
    s += `<line x1="0" x2="${w}" y1="${y(10 ** e)}" y2="${y(10 ** e)}" stroke="#e7e5e0"/>`;
  }
  if (axes) {
    for (let e = Math.floor(Math.log10(Math.exp(lo))) - 1; e <= Math.ceil(Math.log10(Math.exp(hi))); e++) for (const m of [1, 2, 5]) {
      const v = m * 10 ** e; if (Math.log(v) < lo || Math.log(v) > hi) continue;
      const onNow = ["wall", "cpu", "energy"].filter(m => MEASURES[m]);
      const unit = onNow.length === 1 && onNow[0] === "wall" ? (SHOW.cost ? " ns/B" : " GB/s") : "";
      s += `<line x1="${L}" x2="${w - R}" y1="${y(v)}" y2="${y(v)}" stroke="#f3f4f6"/><text x="${L - 6}" y="${y(v) + 4}" font-size="11" fill="#6b7280" text-anchor="end">${+v.toPrecision(2)}${unit}</text>`;
    }
